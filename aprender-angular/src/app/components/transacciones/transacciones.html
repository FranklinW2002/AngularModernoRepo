<h2>Lista de transacciones</h2>

<ol>
    @for(transaccion of transacciones; track transaccion.id){
        <li>
            {{transaccion.descripcion}} -
            ${{transaccion.monto}} -
            {{transaccion.tipo}}
        </li>
    }
</ol>

<h2>descripcion de transaccion</h2>
<input type="text" [(ngModel)] = "descripcionTransaccion">
<p>
    Mi transaccion es: 
    <strong>{{descripcionTransaccion}}</strong>
</p>

<button (click)="enviarSaludo()" >Enviar mensaje</button>
